# The generic ladder. Every peripheral, on every SoC, goes through these layers.
# Bus templates fill in pinmux/controller/node, subsystem templates fill in
# subsystem/userspace/app. The steps below are shared by all of them.
layers:
  - {id: hardware,   title: Hardware,     eli5: "Which wires is the toy plugged into?"}
  - {id: pinmux,     title: Pinmux,       eli5: "Set the socket to the right shape"}
  - {id: controller, title: Controller,   eli5: "Switch on the room the socket is in"}
  - {id: node,       title: Device node,  eli5: "Tell the house what toy is there"}
  - {id: driver,     title: Driver,       eli5: "No instruction book yet? Bring one and put it in the library"}
  - {id: kconfig,    title: Kernel config,eli5: "Make sure the instruction book is in the library"}
  - {id: deploy,     title: Deploy,       eli5: "Give the house its new map"}
  - {id: probe,      title: Probe,        eli5: "Did the book get matched to the toy?"}
  - {id: subsystem,  title: Subsystem,    eli5: "Is the toy in the right toy box?"}
  - {id: userspace,  title: Userspace,    eli5: "Play with it using standard tools"}
  - {id: app,        title: App,          eli5: "Use it from your own program"}

before_bus:
  - id: hardware
    layer: hardware
    title: "Know the wires for {{ dev.name }}"
    why: |
      Software can't fix a wiring mistake, and a wrong guess about pins causes the
      worst kind of bug: everything compiles and nothing happens. Before touching
      any file, confirm against the schematic and datasheet:

      * which SoC pads the signals land on, and whether a header or level shifter is in between
      * the IO voltage on both sides (the i.MX93 GPIO bank voltage vs. the device's)
      * pull-ups (I2C needs them), and whether reset/enable pins need driving
      * that no other function on the board already uses these pads (checked below)
    do: |
      {%- if pins %}
      Pads in your form:
      {% for p in pins %}
      * **{{ p.pad }}** → `{{ p.function or '?' }}`{% if not p.macro and soc.pins.header %} ⚠ no matching mux found{% endif %}{% if p.options and not p.macro %}. Options: {{ p.options|join(', ') }}{% endif %}
      {%- endfor %}
      {%- endif %}
      {%- if binding %}

      Binding **{{ binding.file }}** requires: `{{ binding.required|join('`, `') }}`
      {%- endif %}
    check: {type: pads_free}

after_bus:
  - id: kconfig
    layer: kconfig
    title: "Enable the driver{{ 's' if kconfig|length > 1 else '' }} in the kernel config"
    why: |
      A device-tree node only describes hardware. A driver must be built into
      the kernel (`=y`) or as a module (`=m`) and claim the node by its
      `compatible` string. The lookup below followed
      compatible → driver source file → Makefile → CONFIG_ symbol
      in **your** kernel tree.
    do: |
      {%- for k in kconfig %}
      * `{{ k.symbol }}`{% if k.prompt %}, "{{ k.prompt }}"{% endif %}{% if k.via %}, needed for {{ k.via }}{% endif %}{% if k.file %} (driver `{{ k.file }}`){% endif %}{% if k.depends %}<br>depends on: `{{ k.depends|join('` and `') }}`{% endif %}
      {%- endfor %}
      {%- if not kconfig %}
      No driver could be found automatically. Set `config:` in the peripheral form.
      {%- endif %}

      Run `make menuconfig`, press `/` and search for each symbol to see where it lives
      and what it depends on. With Yocto, add a config fragment instead of editing .config.
    command: "{% for k in kconfig %}zcat /proc/config.gz | grep {{ k.symbol }}={% if not loop.last %} ; {% endif %}{% endfor %}"
    check: {type: kconfig}      # checks every symbol listed above against /proc/config.gz

  - id: deploy
    layer: deploy
    when: bus.needs_dt
    title: "Build the .dtb and boot the board with it"
    why: |
      Your edits live in the source tree, but the kernel only sees the compiled
      .dtb that the bootloader hands it. This check reads the **live** device tree
      (/sys/firmware/devicetree) on the board, so it only passes once the new .dtb
      has actually booted. It catches the classic mistake of "I edited it, but
      the board still boots the old dtb".
    do: |
      ```
      {{ deploy.build_dtb }}
      {{ deploy.install_dtb }}
      ```
      {{ deploy.install_hint }}
      Then reboot and press **Rescan board**.
    command: "{{ deploy.build_dtb }}"
    check: {type: dt_live, compatible: "{{ dev.compatible or '' }}", label: "{{ ctrl.label if not dev.compatible else '' }}"}

  - id: probe
    layer: probe
    title: "Check the driver bound (probed) to the device"
    why: |
      At boot the kernel walks the device tree, creates a device for each enabled
      node, and calls `probe()` on the driver whose `compatible` matches. Probe can:

      * **succeed**: the device appears under its driver in /sys
      * **defer**: something it needs (clock, GPIO, regulator, codec) isn't ready yet, so it retries later. Stuck deferrals are listed in /sys/kernel/debug/devices_deferred
      * **fail**: the error is in dmesg, usually a missing property, a wrong address or no ACK on the bus
    do: |
      Look at dmesg for the driver name:
      ```
      dmesg | grep -i {{ driver.name if driver else (dev.driver or dev.label) }}
      ls -l /sys/bus/*/drivers/{{ driver.name if driver else (dev.driver or '<driver>') }}/
      ```
    command: "dmesg | grep -i {{ driver.name if driver else (dev.driver or dev.label) }}"
    check: {type: probe}        # node(s) with our compatible have a driver bound

# Reusable steps. Bus templates pull these in with `- use: pinmux` and can
# override any field.
common:
  pinmux:
    id: pinmux
    layer: pinmux
    when: pins
    title: "Mux {{ pins|map(attribute='pad')|join(', ') }} for {{ dev.name }}"
    why: |
      Each SoC pad can carry one of several signals (GPIO, I2C, SPI, SAI and others),
      and the pin controller decides which one. Until the pad is muxed, the
      peripheral's signals don't reach the outside world, even with the controller
      enabled. Pad settings (pull, drive strength, open-drain) are set in the same place.
    do: |
      Add this group inside the `{{ soc.pins.pinctrl_parent }} { ... }` block{% if anchor.line %} (board file, line {{ anchor.line }}){% endif %}.
      {%- if soc.pins.header %}
      The mux names were looked up in `{{ soc.pins.header }}`, not guessed. The pad
      values are the defaults NXP uses for this kind of signal; check the SW_PAD_CTL register in the RM if the signals look bad on a scope.
      {%- endif %}
      {%- for p in pins if not p.macro and soc.pins.header %}

      ⚠ **{{ p.pad }}**: no `{{ p.wanted or 'matching' }}` function. This pad can be: {{ p.options|join(', ') }}
      {%- endfor %}
    file: board
    anchor: "{{ soc.pins.pinctrl_parent }}"
    snippet: "{{ snip.pinctrl_group }}"
    check: {type: pins_muxed}

  controller:
    id: controller
    layer: controller
    when: ctrl.label
    title: "Enable &{{ ctrl.label }}"
    why: |
      The SoC .dtsi describes every controller on the chip but leaves most of them
      `status = "disabled"`, because only the board knows which ones are wired out.
      The board file switches on the ones it uses and attaches their pinctrl group.

      Right now **&{{ ctrl.label }}** is **{{ ctrl.status or 'not found' }}**{% if ctrl.status_set_at %}, set at {{ ctrl.status_set_at.file }}:{{ ctrl.status_set_at.line }}{% endif %}.
      {%- if ctrl.compatible %} It is a `{{ ctrl.compatible }}` controller.{% endif %}
    do: |
      {%- if anchor.exists %}
      Your board file already has a `&{{ ctrl.label }}` block at line {{ anchor.line }}. Make sure it contains the lines below.
      {%- else %}
      Add a new top-level `&{{ ctrl.label }}` block to the board file (order the blocks alphabetically, as the kernel style does).
      {%- endif %}
      Compare with the **examples from other boards** below; they show which clock and DMA properties this controller usually needs on this SoC.
    file: board
    anchor: "&{{ ctrl.label }}"
    snippet: |
      &{{ ctrl.label }} {
      {{ snip.pinctrl_props | tabs(1) if pins else '' }}
      {{ snip.controller_extra | tabs(1) }}
      	status = "okay";
      };
    examples: {label: "{{ ctrl.label }}"}
    check: {type: source_status, label: "{{ ctrl.label }}", expect: okay}

# Shown when the device's driver is not in your kernel tree (or you set
# `driver_src:` in the form). Works for any device: sensor, codec, camera...
driver_port:
  - id: driver_get
    layer: driver
    when: port.active
    title: "{% if port.state == 'not_built' %}Driver source is in the tree but not built{% else %}Get a driver for {{ dev.compatible }}{% endif %}"
    why: |
      Linux pairs a device-tree node with a driver by the `compatible` string. We searched
      **your** kernel tree (`drivers/`, `sound/`) for `"{{ dev.compatible }}"`
      {%- if port.state == 'missing' %} and found **no driver**. The node alone won't do anything.{% elif port.state == 'not_built' %}: the C file exists, but no Makefile line builds it.{% else %}.{% endif %}

      Where drivers usually come from, best first:

      * **A newer kernel or your SoC vendor's BSP.** Search on elixir.bootlin.com or in your vendor's kernel tree. If it's there, cherry-picking that commit is the cleanest route.
      * **The module/board maker's kernel fork.** Camera and display makers often ship drivers in their own tree, for example the Raspberry Pi kernel or a vendor GitHub.
      * **A sibling driver.** Chips in the same family often share most registers, so you adapt the closest one.
      * **Write one** from the datasheet, starting from a similar driver in the same subsystem.
    do: |
      Save the driver's `.c` file somewhere (for example `drivers-extra/` in this workspace) and add to the form:
      ```
      driver_src: drivers-extra/{{ port.module }}.c
      ```
      {%- if port.src and not port.src_ok %}

      ⚠ `{{ port.src }}` was not found (looked in the workspace and the kernel tree).
      {%- elif port.src_ok and not port.src_compat_ok %}

      ⚠ That file does not declare `"{{ dev.compatible }}"`. It declares: `{{ driver_req.compatibles|join('`, `') if driver_req else '?' }}`. Use the same string in the form.
      {%- endif %}
      {%- if driver_req %}

      **Read from the driver code:** bus `{{ driver_req.bus or '?' }}`
      {%- if driver_req.supply %}, supplies `{{ driver_req.supply|join('`, `') }}`{% endif %}
      {%- if driver_req.clock %}, clock{% if driver_req.clock_hz %} at {{ driver_req.clock_hz }} Hz{% endif %}{% endif %}
      {%- if driver_req.gpio %}, gpios `{{ driver_req.gpio|join('`, `') }}`{% endif %}
      {%- if driver_req.endpoint %}, a graph endpoint{% if driver_req.lanes %} ({{ driver_req.lanes|join(' or ') }} data lanes){% endif %}{% endif %}.
      {%- endif %}
    command: "grep -rn '\"{{ dev.compatible }}\"' drivers/ sound/"
    check: {type: driver_source}

  - id: driver_integrate
    layer: driver
    when: port.active
    title: "Add {{ port.module }}.c to the kernel build ({{ port.config }})"
    why: |
      A C file in the tree isn't built until two small hooks exist:

      * **Makefile:** `obj-$({{ port.config }}) += {{ port.module }}.o` means "build this when the option is on".
      * **Kconfig:** the `config {{ port.symbol }}` entry makes the option appear in menuconfig, and lists what it depends on or selects.

      Alternative for quick experiments: build it **out of tree** as a module (`make -C <kernel> M=$PWD`).
      It's faster to iterate, but must be rebuilt for every kernel version.
    do: |
      Copy the file into `{{ port.dir }}/`, then add the two entries below.
      Put the Kconfig entry near similar drivers in `{{ port.dir }}/Kconfig`, keeping alphabetical order.
      {%- if driver_req and driver_req.selects %}
      The `select` lines were derived from the helper APIs the driver calls.
      {%- endif %}
    file: "{{ port.dir }}/Kconfig"
    snippet: |
      # 1. copy the source
      cp {{ port.src or ('<driver>.c') }} {{ port.dest }}

      # 2. {{ port.dir }}/Makefile
      obj-$({{ port.config }}) += {{ port.module }}.o

      # 3. {{ port.dir }}/Kconfig
      config {{ port.symbol }}
      	tristate "{{ dev.name }} driver ({{ dev.compatible }})"
      {%- if driver_req and driver_req.bus == 'i2c' %}
      	depends on I2C
      {%- elif driver_req and driver_req.bus == 'spi' %}
      	depends on SPI
      {%- endif %}
      {%- for s in (driver_req.selects if driver_req else []) %}
      	select {{ s }}
      {%- endfor %}
      	help
      	  Driver for {{ dev.name }}. Brought in from {{ port.src or 'an external source' }}.
    check: {type: kernel_text, file: "{{ port.dir }}/Makefile", pattern: 'obj-\$\({{ port.config }}\)\s*\+=\s*{{ port.module }}\.o'}

  - id: driver_build
    layer: driver
    when: port.active
    title: "Compile {{ port.module }}.o against your kernel"
    why: |
      Kernel-internal APIs change between versions, so a driver written for one kernel
      often fails to compile on another. The fixes are usually small renames, and the
      compiler error points right at them. Building just this one object takes seconds.
      {%- if driver_req and driver_req.port_hints %}

      Spotted in this driver's code:
      {% for h in driver_req.port_hints %}
      * {{ h }}
      {%- endfor %}
      {%- endif %}
    do: |
      Turn the option on first (`make menuconfig`, press `/`, search `{{ port.symbol }}`), then build just this file:
      ```
      make ARCH={{ soc.arch or 'arm64' }} CROSS_COMPILE=aarch64-linux-gnu- {{ port.object }}
      ```
      Then build the module and copy it to the board:
      `make ... modules`, then `scp {{ port.dir }}/{{ port.module }}.ko` to the board, then `depmod -a` and `modprobe {{ port.module }}`.
    command: "make ARCH={{ soc.arch or 'arm64' }} CROSS_COMPILE=aarch64-linux-gnu- {{ port.object }}"
    check: {type: kernel_file, path: "{{ port.object }}"}

  - id: driver_props
    layer: node
    when: driver_req and bus.needs_dt and dev.compatible
    title: "Cross-check your node against what the driver reads"
    why: |
      Binding docs say what a node *should* have. The driver code shows what it
      **actually asks for** at probe time. A missing supply or clock is the most
      common reason for a silent `-EPROBE_DEFER` or "failed to get ..." in dmesg.
      This check compares your node with the lookups found in
      {{ (driver.file if driver and driver.file else port.src) or 'the driver' }}.
    do: |
      {%- if driver_req.supply %}
      * supplies: {% for s in driver_req.supply %}`{{ s }}-supply`{% if not loop.last %}, {% endif %}{% endfor %}
      {%- endif %}
      {%- if driver_req.clock %}
      * clocks: {{ driver_req.clock|join(', ') }}{% if driver_req.clock_hz %}, **must be {{ driver_req.clock_hz }} Hz**{% endif %}
      {%- endif %}
      {%- if driver_req.gpio %}
      * gpios: {% for g in driver_req.gpio %}`{{ g }}-gpios`{% if g in driver_req.optional %} (optional){% endif %}{% if not loop.last %}, {% endif %}{% endfor %}
      {%- endif %}
      {%- if driver_req.endpoint %}
      * a `port { endpoint { ... } }` graph link{% if driver_req.lanes %} with `data-lanes` ({{ driver_req.lanes|join(' or ') }} lanes){% endif %}{% if driver_req.link_freq_values %} and `link-frequencies` = {{ driver_req.link_freq_values|join(' or ') }}{% endif %}
      {%- endif %}
      {%- if driver_req.property %}
      * properties it reads (often optional, check the code for defaults): `{{ driver_req.property|join('`, `') }}`
      {%- endif %}
    check: {type: driver_props}
