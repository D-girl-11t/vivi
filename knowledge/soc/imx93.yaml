# SoC profile: everything that is specific to the NXP i.MX93 lives here.
# Bus and subsystem templates never mention NXP; they ask this file.
id: imx93
title: NXP i.MX93
arch: arm64
dts_dir: arch/arm64/boot/dts/freescale
sibling_prefix: imx93          # "learn from other boards" searches imx93*.dts*
status: complete

# Where this SoC vendor publishes its kernel, and how a running kernel version maps to a git tag.
# Board `uname -r` 6.18.2-1.0.0-gf49f45233f7b  ->  tag lf-6.18.2-1.0.0
kernel_repo: https://github.com/nxp-imx/linux-imx
kernel_tag: 'lf-{version}'          # {version} = uname -r without the "-g<commit>" suffix

# ---------------------------------------------------------------- pins
# Pads are named like GPIO_IO08. The pinfunc header lists every legal
# (pad, function) pair, so we never have to guess a mux macro.
pins:
  header: arch/arm64/boot/dts/freescale/imx93-pinfunc.h
  macro_regex: '#define\s+(MX93_PAD_{pad}__(\w+))\s'   # group1 = macro, group2 = function
  usage_regex: 'MX93_PAD_{pad}__\w+'                   # pad already used somewhere?
  gpio_function_regex: '^GPIO(\d+)_IO(\d+)$'           # GPIO2_IO08 -> bank 2, line 8
  gpio_controller: 'gpio{bank}'
  pinctrl_parent: '&iomuxc'                            # pinctrl groups go inside this block

# Pad control (SW_PAD_CTL) defaults, taken from NXP's own i.MX93 board files.
# Bits: drive strength, slew, pull, open-drain (bit 30 = SION, needed for I2C).
# VERIFY against the reference manual if signals look bad on a scope.
padconf:
  i2c: '0x40000b9e'   # open-drain + SION, as used by every i.MX93 board for LPI2C
  spi: '0x31e'
  uart: '0x31e'
  sai: '0x31e'
  gpio: '0x31e'
  default: '0x31e'

# ---------------------------------------------------------------- controllers
# How "instance n of bus X" is spelled in this SoC's dtsi.
controllers:
  i2c:  { label: 'lpi2c{n}',  function_prefix: 'LPI2C{n}_' }
  spi:  { label: 'lpspi{n}',  function_prefix: 'LPSPI{n}_' }
  uart: { label: 'lpuart{n}', function_prefix: 'LPUART{n}_', tty: 'ttyLP{m}' }
  sai:  { label: 'sai{n}',    function_prefix: 'SAI{n}_' }
  usb:  { label: 'usbotg{n}' }
  gpio: { label: 'gpio{n}',   function_prefix: 'GPIO' }
  csi2: { label: 'lpi2c{n}',  function_prefix: 'LPI2C{n}_' }   # a CSI camera's control bus is I2C

# ---------------------------------------------------------------- snippets
# Jinja templates rendered with the planner context (dev, pins, ctrl, ...).
snippets:
  pinctrl_group: |
    pinctrl_{{ dev.label }}: {{ dev.slug }}grp {
    	fsl,pins = <
    {%- for p in pins %}
    		{{ p.macro or ('MX93_PAD_' ~ p.pad ~ '__???') }}	{{ p.padconf }}
    {%- endfor %}
    	>;
    };
  pinctrl_props: |
    pinctrl-names = "default";
    pinctrl-0 = <&pinctrl_{{ dev.label }}>;
  # Extra properties some controllers need when enabled on this SoC
  controller_extra:
    sai: |
      #sound-dai-cells = <0>;
      assigned-clocks = <&clk IMX93_CLK_SAI{{ ctrl.n }}>;
      assigned-clock-parents = <&clk IMX93_CLK_AUDIO_PLL>;
      assigned-clock-rates = <12288000>;
      fsl,sai-mclk-direction-output;
    i2c: |
      clock-frequency = <{{ dev.connection.bus_hz | default(100000) }}>;
    csi2: |
      clock-frequency = <{{ dev.connection.bus_hz | default(400000) }}>;
    usb: |
      dr_mode = "host";

# ---------------------------------------------------------------- camera (MIPI CSI-2)
# Pipeline: sensor -> MIPI CSI-2 receiver (+ D-PHY) -> ISI capture -> /dev/videoN.
# NXP changed the camera DT layout between BSP releases. The planner uses the first
# style whose `detect` label exists in your tree. Mainline (as of 7.3) has no i.MX93 camera nodes.
camera:
  max_lanes: 2
  bsp_hint: "NXP linux-imx, github.com/nxp-imx/linux-imx, matching your Yocto release"
  notes: |
    **No ISP on the i.MX93.** The ISI can scale and convert YUV/RGB, but it can't
    demosaic raw Bayer. A raw sensor gives you raw frames (RAW10/RAW8): fine for
    capture and machine vision, but for normal colour images you debayer in software
    (libcamera's software ISP, GStreamer `bayer2rgb`, or OpenCV `cvtColor`) or use a
    module with an on-board ISP (sensors that output YUV, or bridges like the AP1302).
  styles:
    - id: nxp-6.12
      title: "NXP lf-6.12 (ports, ISI with endpoint)"
      detect: isi
      csi: mipi_csi
      csi_in: mipi_csi_in
      isi: isi
      lanes: "{{ dev.lane_list }}"          # data-lanes lists the lanes: <1 2>
      receiver: |
        &mipi_csi {
        	status = "okay";

        	ports {
        		#address-cells = <1>;
        		#size-cells = <0>;

        		port@0 {
        			reg = <0>;

        			mipi_csi_in: endpoint {
        				remote-endpoint = <&{{ dev.label }}_ep>;
        				data-lanes = <{{ dev.lane_list }}>;
        				clock-lanes = <0>;
        			};
        		};

        		port@1 {
        			reg = <1>;

        			mipi_csi_out: endpoint {
        				remote-endpoint = <&isi_in>;
        			};
        		};
        	};
        };

        &dphy_rx {
        	status = "okay";
        };
      capture: |
        &isi {
        	status = "okay";

        	port {
        		isi_in: endpoint {
        			remote-endpoint = <&mipi_csi_out>;
        		};
        	};
        };
    - id: nxp-6.6
      title: "NXP lf-6.6 (single port, ISI cap_device)"
      detect: isi_0
      csi: mipi_csi
      csi_in: mipi_csi_ep
      isi: isi_0
      lanes: "{{ dev.lanes }}"              # this NXP driver reads data-lanes as a lane COUNT: <2>
      receiver: |
        &mipi_csi {
        	status = "okay";

        	port {
        		mipi_csi_ep: endpoint {
        			remote-endpoint = <&{{ dev.label }}_ep>;
        			data-lanes = <{{ dev.lanes }}>;
        			cfg-clk-range = <28>;
        			hs-clk-range = <0x2b>;
        			bus-type = <4>;
        		};
        	};
        };
      capture: |
        &isi_0 {
        	status = "okay";

        	cap_device {
        		status = "okay";
        	};
        };

# ---------------------------------------------------------------- real-time offload
coprocessor:
  core: Cortex-M33
  linux_api: remoteproc + RPMsg
  dt_label: cm33
  notes: >
    Timing-critical work (fast quadrature decoding, motor PWM loops) can run on the
    M33 under FreeRTOS/Zephyr. Linux loads firmware via /sys/class/remoteproc and
    talks to it over RPMsg (/dev/ttyRPMSG* or rpmsg_char).

# ---------------------------------------------------------------- deploy
deploy:
  build_dtb: 'make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- {{ files.dtb_target }}'
  build_kernel: 'make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image modules'
  install_hint: |
    On NXP Yocto images the boot FAT partition is usually /run/media/boot-mmcblk0p1
    (eMMC) or boot-mmcblk1p1 (SD). In U-Boot, `printenv fdtfile` tells you which
    .dtb is loaded. Keep a copy of the original .dtb before overwriting it.
  install_dtb: 'scp {{ files.dtb_out }} {{ board.host | default("root@board") }}:/run/media/boot-mmcblk0p1/'
